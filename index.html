<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>블록 스피킹 원정대 🧩🎤</title>
  
  <!-- Tailwind CSS & Confetti -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    /* 🌿 눈이 편안하고 깊이 있는 차분한 포레스트 그린 배경 (파스텔톤 배제) */
    body {
      font-family: 'Jua', 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: linear-gradient(180deg, #1b4332 0%, #2d6a4f 50%, #1b4332 100%) !important;
      min-height: 100vh;
    }

    .font-eng {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    /* 3D 완구 버튼 효과 */
    .toy-btn {
      transition: all 0.1s ease-in-out;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }
    .toy-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
    }

    /* 단어 블록 스타일 */
    .word-block {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }
    .word-block:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .word-block:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
    }

    /* 조립 슬롯 구역 */
    .slot-zone {
      min-height: 90px;
      border: 3px dashed #74c69d;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.9);
    }
    .slot-zone.drag-over {
      border-color: #2d6a4f;
      background-color: #d8f3dc;
      transform: scale(1.01);
    }

    /* 오답 흔들림 */
    @keyframes shakeMotion {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shakeMotion 0.35s ease;
    }

    /* 마이크 녹음 중 펄스 효과 */
    @keyframes micGlowPulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-active {
      animation: micGlowPulse 1.2s infinite;
      background-color: #ef4444 !important;
      border-color: #b91c1c !important;
    }
  </style>
</head>
<body class="flex flex-col text-slate-800 p-2 sm:p-4 md:p-6">

  <!-- 헤더 영역 -->
  <header class="max-w-4xl w-full mx-auto flex flex-wrap items-center justify-between bg-white/95 backdrop-blur-md px-4 py-3 sm:px-6 rounded-3xl shadow-lg border border-emerald-900/20 gap-3 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-[#2d6a4f] rounded-2xl flex items-center justify-center text-2xl shadow-inner text-white font-black">
        🦁
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-wide flex items-center gap-1.5">
          블록 스피킹 원정대
          <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full uppercase tracking-wider font-eng font-bold">Step</span>
        </h1>
        <p class="text-xs text-slate-500 font-sans">입으로 먼저 말해보고, 모르면 블록 힌트!</p>
      </div>
    </div>

    <!-- 스코어 & 새로고침 -->
    <div class="flex items-center gap-2 sm:gap-3 ml-auto">
      <div class="flex items-center gap-1 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-2xl" title="코인">
        <span class="text-lg">🪙</span>
        <span id="coinScore" class="font-bold text-amber-700 text-base sm:text-lg">0</span>
      </div>
      <div class="flex items-center gap-1 bg-rose-50 border border-rose-200 px-2.5 py-1.5 rounded-2xl" title="연속 정답">
        <span class="text-lg">🔥</span>
        <span id="streakCount" class="font-bold text-rose-600 text-base sm:text-lg">0</span>
      </div>
      <button id="refreshBtn" class="toy-btn bg-[#2d6a4f] hover:bg-[#1b4332] text-white text-sm px-3.5 py-2 rounded-2xl flex items-center gap-1 font-bold" title="시트 다시 가져오기">
        <span id="refreshIcon">🔄</span>
        <span class="hidden sm:inline">새로고침</span>
      </button>
    </div>
  </header>

  <!-- 메인 게임 영역 -->
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col gap-3.5">
    
    <!-- 1번 박스: 제목(우리말 문장) 빼고 배지, 아이콘, 부가 문구 전부 삭제 -->
    <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-lg border border-emerald-900/10 text-center flex items-center justify-center min-h-[130px]">
      <div id="koreanSentence" class="text-2xl sm:text-3xl md:text-4xl font-black text-slate-900 tracking-tight leading-snug">
        문장을 불러오는 중입니다... 🧩
      </div>
    </div>

    <!-- 2번 박스 (1단계): 스피킹 단독 영역 -->
    <div id="stage1Box" class="bg-white rounded-3xl p-6 sm:p-10 shadow-lg border border-emerald-900/10 flex flex-col items-center justify-center text-center gap-4">
      <p class="text-base sm:text-lg font-black text-slate-800">
        머릿속으로 영어가 떠올랐나요?
      </p>

      <button id="mainMicBtn" class="toy-btn bg-rose-500 hover:bg-rose-600 text-white font-black text-lg sm:text-xl px-10 sm:px-14 py-4 rounded-3xl flex items-center gap-3 shadow-md transition-all scale-105">
        <span id="mainMicIcon" class="text-3xl">🎤</span>
        <span id="mainMicLabel">마이크 누르고 말하기</span>
      </button>

      <!-- 2단계 진입 버튼 -->
      <button id="openBlockBtn" class="mt-3 text-sm text-[#1b4332] hover:text-black bg-[#d8f3dc] hover:bg-[#b7e4c7] px-5 py-2.5 rounded-2xl border border-[#74c69d] font-black transition flex items-center gap-1.5 shadow-sm">
        <span>🧩 잘 모르겠어요 (단어 블록 보기)</span>
      </button>
    </div>

    <!-- 3번 박스 (2단계): 블록 조립 컨테이너 (초기 숨김) -->
    <div id="stage2Box" style="display: none;" class="flex flex-col gap-3.5">
      <!-- 내가 만든 문장 박스 -->
      <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-lg border border-emerald-900/10">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-sm sm:text-base font-bold text-slate-700 flex items-center gap-1">
              <span>🎯</span> 내가 만든 문장
            </span>
            <span class="text-xs text-slate-400 font-sans hidden sm:inline">(블록을 누르면 보관함으로 돌아갑니다)</span>
          </div>
          <button id="clearBtn" class="text-xs text-rose-500 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-xl transition flex items-center gap-1">
            <span>🔄</span> 비우기
          </button>
        </div>

        <div id="assembledSlots" class="slot-zone p-3 sm:p-4 flex flex-wrap items-center gap-2 sm:gap-3 transition-colors duration-200">
          <div id="emptyGuideText" class="w-full text-center text-slate-400 text-xs sm:text-sm py-4 flex flex-col items-center justify-center pointer-events-none">
            <span class="text-2xl mb-1">👇</span>
            <span>아래 단어 블록을 클릭해서 문장을 완성해보세요!</span>
          </div>
        </div>
      </div>

      <!-- 단어 보관함 -->
      <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-lg border border-emerald-900/10">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-sm sm:text-base font-bold text-slate-700 flex items-center gap-1">
            <span>📦</span> 단어 블록 보관함
          </span>
          <span class="text-xs text-[#2d6a4f] font-bold">블록 힌트가 열렸어요!</span>
        </div>
        <div id="wordPool" class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 min-h-[90px] p-3 bg-slate-50 rounded-2xl border border-slate-200">
          <!-- 블록 동적 렌더링 -->
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤 버튼 바 -->
    <div class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-4 mt-1 pb-4">
      <button id="subMicBtn" style="display: none;" class="toy-btn bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm sm:text-base px-4 sm:px-5 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span class="text-lg">🎤</span>
        <span>다시 말하기</span>
      </button>

      <button id="checkBlockBtn" style="display: none;" class="toy-btn bg-[#2d6a4f] hover:bg-[#1b4332] text-white font-bold text-base sm:text-lg px-6 sm:px-10 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>✨ 블록 정답 확인</span>
      </button>

      <button id="giveUpBtn" style="display: none;" class="toy-btn bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-sm sm:text-base px-4 sm:px-6 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>💡 정답 보기</span>
      </button>

      <button id="nextBtn" style="display: none;" class="toy-btn bg-[#2d6a4f] hover:bg-[#1b4332] text-white font-bold text-base sm:text-lg px-8 sm:px-12 py-3 rounded-2xl flex items-center gap-2 animate-pulse shadow-md">
        <span>다음 문제 ➡️</span>
      </button>
    </div>
  </main>

  <script>
    /* ==========================================================================
       1. 효과음 합성기 (Web Audio API)
       ========================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }, delay * 1000);
    }

    const sound = {
      pop() { playTone(580, 'triangle', 0.07); },
      drop() { playTone(440, 'sine', 0.08); },
      hint() { playTone(520, 'sine', 0.12); playTone(680, 'sine', 0.18, 0.08); },
      mic() { playTone(750, 'sine', 0.12); },
      success() {
        playTone(523.25, 'sine', 0.12, 0.0);
        playTone(659.25, 'sine', 0.12, 0.08);
        playTone(783.99, 'sine', 0.12, 0.16);
        playTone(1046.50, 'triangle', 0.35, 0.24);
      },
      wrong() {
        playTone(320, 'sawtooth', 0.15, 0.0);
        playTone(220, 'sawtooth', 0.25, 0.12);
      }
    };

    /* ==========================================================================
       2. 구글 스프레드시트 설정
       ========================================================================== */
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8N05mr2cDulqUEd6ws-n6SOOE-L3yaBSUDg43QPP1Xmz65CCeu_5Kl84OFzUi8MoNlRRpoATStnfW/pub?output=csv";

    const BACKUP_QUESTIONS = [
      {
        kr: "나는 매일 아침 사과를 먹어요.",
        en: "I eat an apple every morning.",
        distractors: ["eats", "apples"]
      },
      {
        kr: "그 고양이는 침대 위에서 자고 있어요.",
        en: "The cat is sleeping on the bed.",
        distractors: ["sleep", "under"]
      }
    ];

    const BLOCK_THEMES = [
      { bg: "bg-emerald-100", text: "text-emerald-950", border: "border-emerald-300" },
      { bg: "bg-amber-100", text: "text-amber-950", border: "border-amber-300" },
      { bg: "bg-sky-100", text: "text-sky-950", border: "border-sky-300" },
      { bg: "bg-purple-100", text: "text-purple-950", border: "border-purple-300" },
      { bg: "bg-teal-100", text: "text-teal-950", border: "border-teal-300" },
      { bg: "bg-orange-100", text: "text-orange-950", border: "border-orange-300" }
    ];

    let questions = [];
    let curIndex = 0;
    let coins = parseInt(localStorage.getItem('block_speaking_coins') || '0', 10);
    let streak = 0;
    let stage = 1;
    let isRecording = false;
    let recognition = null;

    // DOM 노드
    const coinScore = document.getElementById('coinScore');
    const streakCount = document.getElementById('streakCount');
    const koreanSentence = document.getElementById('koreanSentence');

    const stage1Box = document.getElementById('stage1Box');
    const stage2Box = document.getElementById('stage2Box');
    const assembledSlots = document.getElementById('assembledSlots');
    const emptyGuideText = document.getElementById('emptyGuideText');
    const wordPool = document.getElementById('wordPool');

    const mainMicBtn = document.getElementById('mainMicBtn');
    const mainMicIcon = document.getElementById('mainMicIcon');
    const mainMicLabel = document.getElementById('mainMicLabel');
    const subMicBtn = document.getElementById('subMicBtn');
    const openBlockBtn = document.getElementById('openBlockBtn');
    const checkBlockBtn = document.getElementById('checkBlockBtn');
    const giveUpBtn = document.getElementById('giveUpBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshIcon = document.getElementById('refreshIcon');

    coinScore.textContent = coins.toLocaleString();
    streakCount.textContent = streak;

    /* ==========================================================================
       3. Web Speech TTS (소리 막힘 완벽 해결)
       ========================================================================== */
    let cachedVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;

      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      setTimeout(() => {
        try {
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'en-US';
          utter.rate = 0.88;
          utter.pitch = 1.05;

          if (cachedVoices.length === 0) loadVoices();
          const targetVoice = cachedVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google US') || v.name.includes('Samantha') || v.name.includes('Jenny'))) ||
                              cachedVoices.find(v => v.lang.startsWith('en'));
          if (targetVoice) utter.voice = targetVoice;

          window.speechSynthesis.speak(utter);
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        } catch (e) {
          console.error("TTS 에러:", e);
        }
      }, 40);
    }

    /* ==========================================================================
       4. Web Speech STT (음성 인식 마이크)
       ========================================================================== */
    function cleanTextForCheck(str) {
      return str.toLowerCase().replace(/[.,!?;:'"()\-]/g, '').replace(/\s+/g, ' ').trim();
    }

    function initSTT() {
      const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechClass) {
        mainMicBtn.classList.add('opacity-50');
        mainMicBtn.title = "크롬 또는 엣지 브라우저에서 마이크 기능을 지원합니다.";
        return;
      }

      recognition = new SpeechClass();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        sound.mic();
        mainMicBtn.classList.add('mic-active');
        mainMicIcon.textContent = "🛑";
        mainMicLabel.textContent = "듣고 있어요... 말씀하세요!";
        subMicBtn.classList.add('mic-active');
      };

      recognition.onresult = (e) => {
        const spoken = e.results[0][0].transcript;
        handleSpokenResult(spoken);
      };

      recognition.onerror = (e) => {
        stopSTT();
      };

      recognition.onend = () => {
        stopSTT();
      };
    }

    function toggleSTT() {
      if (!recognition) {
        alert("크롬(Chrome) 또는 엣지(Edge) 브라우저를 사용해 주세요!");
        return;
      }
      if (isRecording) {
        recognition.stop();
        stopSTT();
      } else {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      }
    }

    function stopSTT() {
      isRecording = false;
      mainMicBtn.classList.remove('mic-active');
      mainMicIcon.textContent = "🎤";
      mainMicLabel.textContent = "마이크 누르고 말하기";
      subMicBtn.classList.remove('mic-active');
    }

    mainMicBtn.addEventListener('click', toggleSTT);
    subMicBtn.addEventListener('click', toggleSTT);

    function handleSpokenResult(spoken) {
      const q = questions[curIndex];
      const spokenClean = cleanTextForCheck(spoken);
      const targetClean = cleanTextForCheck(q.en);

      if (spokenClean === targetClean) {
        onAnswerCorrect(15);
      } else {
        sound.wrong();
        streak = 0;
        streakCount.textContent = streak;
      }
    }

    /* ==========================================================================
       5. 단계 컨트롤
       ========================================================================== */
    function setGameStage(newStage) {
      stage = newStage;
      if (stage === 1) {
        stage1Box.style.display = "flex";
        stage2Box.style.display = "none";
        subMicBtn.style.display = "none";
        checkBlockBtn.style.display = "none";
        giveUpBtn.style.display = "none";
      } else if (stage === 2) {
        stage1Box.style.display = "none";
        stage2Box.style.display = "flex";
        subMicBtn.style.display = "inline-flex";
        checkBlockBtn.style.display = "inline-flex";
        giveUpBtn.style.display = "inline-flex";
      } else if (stage === 3) {
        stage1Box.style.display = "none";
        stage2Box.style.display = "flex";
        checkBlockBtn.style.display = "none";
        giveUpBtn.style.display = "none";
        subMicBtn.style.display = "none";
      }
    }

    openBlockBtn.addEventListener('click', () => {
      sound.hint();
      setGameStage(2);
    });

    giveUpBtn.addEventListener('click', () => {
      sound.pop();
      setGameStage(3);
      revealAnswerDirectly();
    });

    function revealAnswerDirectly() {
      const q = questions[curIndex];
      assembledSlots.innerHTML = '';
      wordPool.innerHTML = '';

      q.tokens.forEach((word, idx) => {
        const blk = makeBlockElement(word, idx);
        assembledSlots.appendChild(blk);
      });

      speakText(q.en);
      nextBtn.style.display = "inline-flex";
    }

    /* ==========================================================================
       6. 블록 조립 및 파싱 로직
       ========================================================================== */
    function tokenizeEnglish(sentence) {
      if (!sentence) return [];
      const clean = sentence.trim();
      const match = clean.match(/[A-Za-z0-9'\-]+|[.,!?;]/g);
      return match || clean.split(/\s+/);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function hashWord(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
      return Math.abs(hash);
    }

    function loadQuestion(idx) {
      if (questions.length === 0) {
        koreanSentence.textContent = "문장을 불러올 수 없습니다. 구글 시트를 확인해주세요.";
        return;
      }
      if (idx >= questions.length) {
        finishGameCelebration();
        return;
      }

      curIndex = idx;
      nextBtn.style.display = "none";

      const q = questions[curIndex];
      koreanSentence.textContent = q.kr;

      assembledSlots.innerHTML = '';
      assembledSlots.appendChild(emptyGuideText);
      emptyGuideText.style.display = 'flex';
      wordPool.innerHTML = '';

      const allTokens = [...q.tokens, ...q.distractors];
      const shuffled = shuffleArray(allTokens);

      shuffled.forEach((word, i) => {
        const blk = makeBlockElement(word, i);
        wordPool.appendChild(blk);
      });

      setGameStage(1);
    }

    function makeBlockElement(word, id) {
      const theme = BLOCK_THEMES[hashWord(word) % BLOCK_THEMES.length];
      const el = document.createElement('div');
      const isPunct = [".", ",", "!", "?"].includes(word);
      const pad = isPunct ? "px-3.5 py-1 text-2xl" : "px-4 py-2 sm:px-5 sm:py-2.5 text-lg sm:text-xl";

      el.className = `word-block font-eng font-bold ${pad} rounded-2xl border-2 ${theme.bg} ${theme.text} ${theme.border} select-none flex items-center justify-center gap-1`;
      el.setAttribute('draggable', 'true');
      el.setAttribute('data-word', word);
      el.setAttribute('data-uid', `blk-${id}-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`);
      el.innerHTML = `<span>${word}</span>`;

      el.addEventListener('click', () => {
        if (stage === 3) return;
        sound.pop();
        if (el.parentElement === wordPool) {
          emptyGuideText.style.display = 'none';
          assembledSlots.appendChild(el);
          sound.drop();
        } else {
          wordPool.appendChild(el);
          sound.drop();
          if (assembledSlots.querySelectorAll('.word-block').length === 0) {
            emptyGuideText.style.display = 'flex';
          }
        }
      });

      el.addEventListener('dragstart', (e) => {
        if (stage === 3) return;
        sound.pop();
        el.classList.add('opacity-40');
        e.dataTransfer.setData('text/plain', el.getAttribute('data-uid'));
      });

      el.addEventListener('dragend', () => el.classList.remove('opacity-40'));

      return el;
    }

    // 드래그 앤 드롭
    [assembledSlots, wordPool].forEach(zone => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const uid = e.dataTransfer.getData('text/plain');
        const blk = document.querySelector(`[data-uid="${uid}"]`);
        if (blk) {
          if (zone === assembledSlots) {
            emptyGuideText.style.display = 'none';
            assembledSlots.appendChild(blk);
          } else {
            wordPool.appendChild(blk);
            if (assembledSlots.querySelectorAll('.word-block').length === 0) emptyGuideText.style.display = 'flex';
          }
          sound.drop();
        }
      });
    });

    clearBtn.addEventListener('click', () => {
      if (stage === 3) return;
      sound.pop();
      const placed = Array.from(assembledSlots.querySelectorAll('.word-block'));
      placed.forEach(b => wordPool.appendChild(b));
      emptyGuideText.style.display = 'flex';
    });

    /* ==========================================================================
       7. 정답 판정 및 보상
       ========================================================================== */
    function onAnswerCorrect(gainCoin) {
      sound.success();
      confetti({ particleCount: 60, spread: 65, origin: { y: 0.7 }, colors: ['#2d6a4f', '#facc15', '#38bdf8', '#f43f5e'] });

      coins += gainCoin;
      streak += 1;
      coinScore.textContent = coins.toLocaleString();
      streakCount.textContent = streak;
      localStorage.setItem('block_speaking_coins', coins);

      speakText(questions[curIndex].en);

      stage1Box.style.display = "none";
      checkBlockBtn.style.display = "none";
      giveUpBtn.style.display = "none";
      subMicBtn.style.display = "none";
      nextBtn.style.display = "inline-flex";
    }

    checkBlockBtn.addEventListener('click', () => {
      const q = questions[curIndex];
      const placed = Array.from(assembledSlots.querySelectorAll('.word-block')).map(b => b.getAttribute('data-word'));

      if (placed.length === 0) {
        playTone(300, 'sine', 0.1);
        return;
      }

      const isSame = placed.length === q.tokens.length && placed.every((w, i) => w.toLowerCase() === q.tokens[i].toLowerCase());

      if (isSame) {
        onAnswerCorrect(10);
      } else {
        sound.wrong();
        assembledSlots.classList.add('animate-shake');
        setTimeout(() => assembledSlots.classList.remove('animate-shake'), 400);
        streak = 0;
        streakCount.textContent = streak;
      }
    });

    nextBtn.addEventListener('click', () => {
      sound.pop();
      loadQuestion(curIndex + 1);
    });

    function finishGameCelebration() {
      sound.success();
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });

      koreanSentence.textContent = "🎉 모든 미션을 완료했어요!";
      stage1Box.style.display = "none";
      stage2Box.style.display = "flex";
      assembledSlots.innerHTML = `
        <div class="w-full py-8 text-center">
          <p class="text-2xl font-black text-slate-800 mb-2">당신은 최고의 스피킹 탐험가! 🏆</p>
          <p class="text-slate-500 mb-4 font-sans">누적 획득 코인: ${coins.toLocaleString()}개 🪙</p>
          <button onclick="loadQuestion(0)" class="toy-btn bg-[#2d6a4f] text-white font-bold text-lg px-8 py-3 rounded-2xl">
            처음부터 다시 도전하기 🚀
          </button>
        </div>
      `;
      wordPool.innerHTML = '';
      checkBlockBtn.style.display = "none";
      giveUpBtn.style.display = "none";
      subMicBtn.style.display = "none";
      nextBtn.style.display = "none";
    }

    /* ==========================================================================
       8. CSV 파서 & 시트 자동 연동
       ========================================================================== */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (insideQuote && next === '"') { cell += '"'; i++; }
          else insideQuote = !insideQuote;
        } else if (c === ',' && !insideQuote) {
          row.push(cell.trim()); cell = '';
        } else if ((c === '\r' || c === '\n') && !insideQuote) {
          if (c === '\r' && next === '\n') i++;
          row.push(cell.trim());
          if (row.some(val => val.length > 0)) rows.push(row);
          row = []; cell = '';
        } else {
          cell += c;
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        if (row.some(val => val.length > 0)) rows.push(row);
      }
      return rows;
    }

    async function loadDataFromSheet() {
      refreshIcon.classList.add('animate-spin');

      try {
        const separator = SHEET_CSV_URL.includes('?') ? '&' : '?';
        const res = await fetch(`${SHEET_CSV_URL}${separator}t=${Date.now()}`);
        if (!res.ok) throw new Error("네트워크 오류");
        const csv = await res.text();
        const parsed = parseCSV(csv);

        const rows = parsed.slice(1);
        const list = [];

        rows.forEach(r => {
          const kr = r[0] || '';
          const en = r[1] || '';
          const dist = r[2] || '';

          if (kr.trim() && en.trim()) {
            list.push({
              kr: kr.trim(),
              en: en.trim(),
              tokens: tokenizeEnglish(en),
              distractors: dist.split(/[,;\s]+/).map(s => s.trim()).filter(s => s.length > 0)
            });
          }
        });

        refreshIcon.classList.remove('animate-spin');
        if (list.length > 0) {
          questions = list;
          loadQuestion(0);
          return;
        }
      } catch (e) {
        console.warn("시트 가져오기 실패, 기본 문장 사용:", e);
      }

      refreshIcon.classList.remove('animate-spin');
      questions = BACKUP_QUESTIONS.map(q => ({
        kr: q.kr,
        en: q.en,
        tokens: tokenizeEnglish(q.en),
        distractors: q.distractors
      }));
      loadQuestion(0);
    }

    refreshBtn.addEventListener('click', () => {
      sound.pop();
      loadDataFromSheet();
    });

    window.addEventListener('DOMContentLoaded', () => {
      initSTT();
      loadDataFromSheet();
    });
  </script>
</body>
</html>
