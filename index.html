<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>블럭 스피킹 원정대 🎤</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Jua', 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-english {
      font-family: 'Fredoka', 'Nunito', sans-serif;
    }

    /* 3D Toy Button */
    .toy-btn {
      transition: all 0.1s ease-in-out;
      box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    }
    .toy-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    /* Word Blocks */
    .word-block {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
      box-shadow: 0 5px 0 rgba(0,0,0,0.14);
      cursor: grab;
    }
    .word-block:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .word-block:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 2px 0 rgba(0,0,0,0.14);
      cursor: grabbing;
    }

    .block-slot-zone {
      min-height: 85px;
      border: 3px dashed #93c5fd;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, rgba(239, 246, 255, 0.8), rgba(243, 232, 255, 0.7));
    }

    .block-slot-zone.drag-over {
      border-color: #3b82f6;
      background-color: #dbeafe;
      transform: scale(1.01);
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shakeWrong 0.35s ease;
    }

    /* Mic recording glow pulse */
    @keyframes micGlow {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-recording {
      animation: micGlow 1.2s infinite;
      background-color: #ef4444 !important;
      border-color: #b91c1c !important;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-amber-100 via-indigo-50 to-sky-100 min-h-screen flex flex-col text-slate-800 p-2 sm:p-4 md:p-6 selection:bg-yellow-200">

  <!-- Header Section -->
  <header class="max-w-4xl w-full mx-auto flex flex-wrap items-center justify-between bg-white/95 backdrop-blur-md px-4 py-3 sm:px-6 rounded-3xl shadow-lg border-2 border-indigo-100 gap-3 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-amber-300 rounded-2xl flex items-center justify-center text-2xl shadow-inner border-2 border-amber-400">
        🦁
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-indigo-800 tracking-wide flex items-center gap-1.5">
          블럭 스피킹 원정대

        </h1>
        <p class="text-xs text-slate-500 font-sans">입으로 먼저 말해보고, 모르면 블록 힌트!</p>
      </div>
    </div>

    <!-- Stats & Refresh Button -->
    <div class="flex items-center gap-2 sm:gap-3 ml-auto">
      <div class="flex items-center gap-1 bg-amber-50 border-2 border-amber-300 px-3 py-1.5 rounded-2xl" title="획득 코인">
        <span class="text-lg">🪙</span>
        <span id="coinScore" class="font-bold text-amber-700 text-base sm:text-lg">0</span>
      </div>
      <div class="flex items-center gap-1 bg-rose-50 border-2 border-rose-300 px-2.5 py-1.5 rounded-2xl" title="연속 정답 스트릭">
        <span class="text-lg">🔥</span>
        <span id="streakCount" class="font-bold text-rose-600 text-base sm:text-lg">0</span>
      </div>
      
      <button id="refreshSheetBtn" class="toy-btn bg-emerald-500 hover:bg-emerald-600 text-white text-sm px-3.5 py-2 rounded-2xl flex items-center gap-1" title="구글 시트 최신 문장 다시 가져오기">
        <span id="refreshIcon">🔄</span>
        <span class="hidden sm:inline font-bold">새로고침</span>
      </button>

  </header>

  <!-- Main Game Layout -->
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col gap-3.5">
    
    <!-- Question Card -->
    <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-xl border-4 border-white/70 relative overflow-hidden">

        <div class="flex items-center gap-2 text-sm">

          <span id="stageBadge" class="text-xs font-bold px-2.5 py-1 rounded-xl bg-rose-100 text-rose-700 border border-rose-200">

          <span id="dataSourceBadge" class="text-[11px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded-lg border border-indigo-200">연결 중...</span>

      </div>

      <!-- Korean sentence prompt -->
      <div class="text-center py-3 sm:py-5">
        <span class="text-xs font-bold text-indigo-400 block mb-1.5">우리말 문장을 보고 영어로 크게 말해보세요!</span>
        <div id="koreanSentence" class="text-2xl sm:text-3xl md:text-4xl font-black text-indigo-950 tracking-tight leading-snug">
          문장을 불러오는 중입니다... 🧩

      </div>

      <!-- Mascot & Bubble Feedback -->
      <div class="flex justify-center items-center mt-1">
        <div id="mascotReaction" class="text-3xl sm:text-4xl transition-all duration-300">
          🐱
        </div>
        <div id="speechBubble" class="ml-2.5 text-xs sm:text-sm bg-indigo-50 text-indigo-800 border border-indigo-200 px-3.5 py-1.5 rounded-2xl font-bold max-w-xs sm:max-w-md">
          마이크 버튼을 누르고 영어로 말해봐!

      </div>
    </div>

    <!-- 1단계: 스피킹 단독 영역 (처음에는 이것만 노출됨) -->
    <div id="speakingChallengeZone" class="bg-white/95 backdrop-blur rounded-3xl p-6 sm:p-10 shadow-xl border-2 border-indigo-100 flex flex-col items-center justify-center text-center gap-4">
      <p class="text-base sm:text-lg font-black text-indigo-900">
        머릿속으로 영어가 떠올랐나요?
      </p>

      <button id="mainMicBtn" class="toy-btn bg-rose-500 hover:bg-rose-600 text-white font-black text-lg sm:text-xl px-10 sm:px-14 py-4 rounded-3xl flex items-center gap-3 shadow-lg transition-all scale-105">
        <span id="mainMicIcon" class="text-3xl">🎤</span>
        <span id="mainMicText">마이크 누르고 말하기</span>
      </button>

      <!-- 모르면 단어 블록 보기 버튼 -->
      <button id="showBlocksBtn" class="mt-3 text-sm text-indigo-700 hover:text-indigo-800 bg-amber-100 hover:bg-amber-200 px-5 py-2.5 rounded-2xl border-2 border-amber-300 font-black transition flex items-center gap-1.5 shadow-sm">

    </div>

    <!-- 2단계: 블록 조립 영역 (처음에는 완벽 숨김) -->
    <div id="blockAssemblyContainer" style="display: none;" class="flex flex-col gap-3.5">
      <!-- Assembled Sentence Box -->
      <div class="bg-white/90 backdrop-blur rounded-3xl p-4 sm:p-5 shadow-lg border-2 border-indigo-100">
        <div class="flex items-center justify-between mb-2">

            <span class="text-xs text-slate-400 font-sans hidden sm:inline">(블록을 누르면 보관함으로 돌아갑니다)</span>

          <button id="clearSlotsBtn" class="text-xs text-rose-500 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-xl transition flex items-center gap-1">
            <span>🔄</span> 비우기
          </button>
        </div>

        <div id="assembledZone" class="block-slot-zone p-3 sm:p-4 flex flex-wrap items-center gap-2 sm:gap-3 transition-colors duration-200">
          <div id="emptySlotPlaceholder" class="w-full text-center text-slate-400 text-xs sm:text-sm py-3.5 flex flex-col items-center justify-center pointer-events-none">
            <span class="text-2xl mb-1">👇</span>
            <span>아래 단어 블록을 클릭해서 문장을 완성해보세요!</span>
          </div>
        </div>
      </div>

      <!-- Word Bank Pool -->
      <div class="bg-white/95 backdrop-blur rounded-3xl p-4 sm:p-5 shadow-xl border-2 border-indigo-100">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-sm sm:text-base font-bold text-slate-700 flex items-center gap-1">
            <span>📦</span> 단어 블록 보관함
          </span>
          <span class="text-xs text-indigo-600 font-bold">블록 힌트가 열렸어요!</span>
        </div>

        <div id="wordBankZone" class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 min-h-[90px] p-3 bg-slate-50 rounded-2xl border border-slate-200">
          <!-- Blocks rendered here -->
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-4 mt-1 pb-4">
      <!-- 2단계에서 블록을 보고 다시 말해보고 싶을 때 -->
      <button id="secondaryMicBtn" style="display: none;" class="toy-btn bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm sm:text-base px-4 sm:px-5 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span class="text-lg">🎤</span>
        <span>다시 말하기</span>
      </button>

      <!-- 2단계 블록 확인 버튼 -->
      <button id="checkBlockBtn" style="display: none;" class="toy-btn bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-base sm:text-lg px-6 sm:px-10 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>✨ 블록 정답 확인</span>
      </button>

      <!-- 3단계: 도저히 모를 때 정답 보기 버튼 -->
      <button id="giveUpBtn" style="display: none;" class="toy-btn bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-sm sm:text-base px-4 sm:px-6 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>💡 정답 보기</span>
      </button>

      <!-- 다음 문제 버튼 -->
      <button id="nextBtn" style="display: none;" class="toy-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base sm:text-lg px-8 sm:px-12 py-3 rounded-2xl flex items-center gap-2 animate-pulse shadow-md">
        <span>다음 문제 ➡️</span>
      </button>
    </div>
  </main>

  <script>
    /* ==========================================================================
       1. Web Audio API Sound Synthesizer (게임 효과음)
       ========================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
          console.warn("Audio error:", e);
        }
      }, delay * 1000);
    }

    const sounds = {
      click() { playTone(580, 'triangle', 0.07); },
      drop() { playTone(440, 'sine', 0.09); },
      hint() { playTone(520, 'sine', 0.15); playTone(680, 'sine', 0.2, 0.1); },
      micStart() { playTone(750, 'sine', 0.12); },
      correct() {
        playTone(523.25, 'sine', 0.14, 0.0);
        playTone(659.25, 'sine', 0.14, 0.08);
        playTone(783.99, 'sine', 0.14, 0.16);
        playTone(1046.50, 'triangle', 0.35, 0.24);
      },
      wrong() {
        playTone(320, 'sawtooth', 0.15, 0.0);
        playTone(220, 'sawtooth', 0.25, 0.12);
      },
      win() {
        [523, 659, 784, 1046, 1318].forEach((f, i) => playTone(f, 'triangle', 0.22, i * 0.1));
      }
    };

    /* ==========================================================================
       2. 구글 스프레드시트 URL 내장
       ========================================================================== */
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8N05mr2cDulqUEd6ws-n6SOOE-L3yaBSUDg43QPP1Xmz65CCeu_5Kl84OFzUi8MoNlRRpoATStnfW/pub?output=csv";

    const FALLBACK_QUESTIONS = [
      {
        korean: "나는 매일 아침 사과를 먹어요.",
        target: ["I", "eat", "an", "apple", "every", "morning", "."],
        rawEnglish: "I eat an apple every morning.",
        distractors: ["eats", "apples"]
      },
      {
        korean: "그 고양이는 침대 위에서 자고 있어요.",
        target: ["The", "cat", "is", "sleeping", "on", "the", "bed", "."],
        rawEnglish: "The cat is sleeping on the bed.",
        distractors: ["sleep", "under"]
      }
    ];

    /* ==========================================================================
       3. 상태 변수 및 요소 참조
       ========================================================================== */
    const BLOCK_PALETTES = [
      { bg: "bg-amber-100", text: "text-amber-950", border: "border-amber-300", hover: "hover:bg-amber-200" },
      { bg: "bg-emerald-100", text: "text-emerald-950", border: "border-emerald-300", hover: "hover:bg-emerald-200" },
      { bg: "bg-sky-100", text: "text-sky-950", border: "border-sky-300", hover: "hover:bg-sky-200" },
      { bg: "bg-purple-100", text: "text-purple-950", border: "border-purple-300", hover: "hover:bg-purple-200" },
      { bg: "bg-rose-100", text: "text-rose-950", border: "border-rose-300", hover: "hover:bg-rose-200" },
      { bg: "bg-orange-100", text: "text-orange-950", border: "border-orange-300", hover: "hover:bg-orange-200" }
    ];

    let questions = [];
    let currentIndex = 0;
    let coins = parseInt(localStorage.getItem('block_english_coins') || '0', 10);
    let currentStreak = 0;
    let currentStage = 1;
    let isRecording = false;
    let recognition = null;

    // DOM References
    const coinScoreEl = document.getElementById('coinScore');
    const streakCountEl = document.getElementById('streakCount');
    const koreanSentenceEl = document.getElementById('koreanSentence');
    const questionBadgeEl = document.getElementById('questionBadge');
    const stageBadgeEl = document.getElementById('stageBadge');
    const dataSourceBadgeEl = document.getElementById('dataSourceBadge');
    const mascotReactionEl = document.getElementById('mascotReaction');
    const speechBubbleEl = document.getElementById('speechBubble');
    
    // Step Zones
    const speakingChallengeZone = document.getElementById('speakingChallengeZone');
    const blockAssemblyContainer = document.getElementById('blockAssemblyContainer');
    const assembledZoneEl = document.getElementById('assembledZone');
    const wordBankZoneEl = document.getElementById('wordBankZone');
    const emptySlotPlaceholderEl = document.getElementById('emptySlotPlaceholder');

    // Buttons
    const mainMicBtn = document.getElementById('mainMicBtn');
    const mainMicIcon = document.getElementById('mainMicIcon');
    const mainMicText = document.getElementById('mainMicText');
    const secondaryMicBtn = document.getElementById('secondaryMicBtn');
    const showBlocksBtn = document.getElementById('showBlocksBtn');
    const checkBlockBtn = document.getElementById('checkBlockBtn');
    const giveUpBtn = document.getElementById('giveUpBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearSlotsBtn = document.getElementById('clearSlotsBtn');
    const refreshSheetBtn = document.getElementById('refreshSheetBtn');
    const refreshIcon = document.getElementById('refreshIcon');

    coinScoreEl.textContent = coins.toLocaleString();
    streakCountEl.textContent = currentStreak;

    /* ==========================================================================
       4. 파서 & 토크나이저
       ========================================================================== */
    function tokenizeEnglishSentence(sentence) {
      if (!sentence) return [];
      const clean = sentence.trim();
      const regex = /[A-Za-z0-9'\-]+|[.,!?;]/g;
      const tokens = clean.match(regex);
      return tokens || clean.split(/\s+/);
    }

    function parseDistractors(distractorText) {
      if (!distractorText) return [];
      return distractorText
        .split(/[,;\s]+/)
        .map(w => w.trim())
        .filter(w => w.length > 0);
    }

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuote && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuote = !insideQuote;
          }
        } else if (char === ',' && !insideQuote) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuote) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(val => val.length > 0)) rows.push(currentRow);
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal.length > 0 || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(val => val.length > 0)) rows.push(currentRow);
      }
      return rows;
    }

    async function fetchQuestionsFromSheet(url) {
      if (!url) return null;
      try {
        const separator = url.includes('?') ? '&' : '?';
        const fetchUrl = `${url}${separator}cb=${Date.now()}`;
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const csvText = await response.text();
        const parsedRows = parseCSV(csvText);
        if (!parsedRows || parsedRows.length === 0) return [];

        const dataRows = parsedRows.slice(1);
        const validQuestions = [];

        dataRows.forEach(row => {
          const korean = row[0] || '';
          const english = row[1] || '';
          const distractors = row[2] || '';

          if (korean.trim() && english.trim()) {
            validQuestions.push({
              korean: korean.trim(),
              target: tokenizeEnglishSentence(english),
              rawEnglish: english.trim(),
              distractors: parseDistractors(distractors)
            });
          }
        });

        return validQuestions;
      } catch (err) {
        console.error("Failed to load Google Sheet data:", err);
        return null;
      }
    }

    /* ==========================================================================
       5. 🔊 완벽하게 작동하는 Web Speech API (잠금 해제 & 확실한 음성 출력)
       ========================================================================== */
    let availableVoices = [];

    function updateVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }

    if ('speechSynthesis' in window) {
      updateVoices();
      window.speechSynthesis.onvoiceschanged = updateVoices;
    }

    // 100% 소리 나는 음성 재생 엔진 (브라우저 멈춤 버그 완벽 방어)
    function speakSentence(text, callback) {
      if (!('speechSynthesis' in window) || !text) {
        if (callback) callback();
        return;
      }

      // 1. 브라우저 음성 큐 강제 취소 및 잠금 해제(resume)
      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }

      // 2. 약간의 딜레이(30ms)를 주어 큐가 정리된 후 발화
      setTimeout(() => {
        try {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.88;
          utterance.pitch = 1.05;

          if (availableVoices.length === 0) {
            availableVoices = window.speechSynthesis.getVoices();
          }

          // 가장 자연스러운 영어 음성 우선 선택
          const voice = availableVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google US') || v.name.includes('Samantha') || v.name.includes('Jenny') || v.name.includes('Ava'))) ||
                        availableVoices.find(v => v.lang.startsWith('en'));
          if (voice) utterance.voice = voice;

          if (callback) {
            utterance.onend = callback;
            utterance.onerror = callback;
          }

          window.speechSynthesis.speak(utterance);

          // 모바일 크롬 백그라운드 멈춤 방지
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
        } catch (e) {
          console.error("음성 출력 오류:", e);
          if (callback) callback();
        }
      }, 30);
    }

    function normalizeForComparison(str) {
      return str.toLowerCase().replace(/[.,!?;:'"()\-]/g, '').replace(/\s+/g, ' ').trim();
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        mainMicBtn.classList.add('opacity-50');
        mainMicBtn.title = "현재 브라우저는 음성 인식을 지원하지 않습니다. (크롬/엣지 권장)";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        sounds.micStart();
        mainMicBtn.classList.add('mic-recording');
        mainMicIcon.textContent = "🛑";
        mainMicText.textContent = "듣고 있어요... 말씀하세요!";
        
        secondaryMicBtn.classList.add('mic-recording');
        mascotReactionEl.textContent = "👂";
        speechBubbleEl.textContent = "영어로 또박또박 말해줘! 잘 듣고 있어...";
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        handleSpokenAnswer(spokenText);
      };

      recognition.onerror = (event) => {
        stopRecording();
        mascotReactionEl.textContent = "🐣";
        if (event.error === 'not-allowed') {
          speechBubbleEl.textContent = "마이크 권한을 허용해줘야 말할 수 있어요! 🎤";
        } else if (event.error === 'no-speech') {
          speechBubbleEl.textContent = "목소리가 들리지 않았어요. 다시 마이크를 눌러볼까요?";
        } else {
          speechBubbleEl.textContent = "다시 한 번 큰 소리로 말해볼까요?";
        }
      };

      recognition.onend = () => {
        stopRecording();
      };
    }

    function startRecording() {
      if (!recognition) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요!");
        return;
      }
      try {
        recognition.start();
      } catch (e) {
        recognition.stop();
      }
    }

    function stopRecording() {
      isRecording = false;
      mainMicBtn.classList.remove('mic-recording');
      mainMicIcon.textContent = "🎤";
      mainMicText.textContent = "마이크 누르고 말하기";
      secondaryMicBtn.classList.remove('mic-recording');
    }

    [mainMicBtn, secondaryMicBtn].forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRecording) {
          recognition.stop();
          stopRecording();
        } else {
          startRecording();
        }
      });
    });

    function handleSpokenAnswer(spokenText) {
      const q = questions[currentIndex];
      const spokenNorm = normalizeForComparison(spokenText);
      const targetNorm = normalizeForComparison(q.rawEnglish || q.target.join(' '));

      if (spokenNorm === targetNorm) {
        handleSuccess(15, `🎉 대단해! 한 번에 스피킹 성공! "${spokenText}" 🌟`);
      } else {
        sounds.wrong();
        currentStreak = 0;
        streakCountEl.textContent = currentStreak;

        mascotReactionEl.textContent = "🐣";
        speechBubbleEl.innerHTML = `들린 말: <span class="text-rose-600 font-bold">"${spokenText}"</span><br>다시 말해보거나, 아래 🧩 단어 블록을 열어볼까?`;
      }
    }

    /* ==========================================================================
       6. 3단계 제어 로직 (스피킹 ➔ 블록 힌트 ➔ 정답 보기)
       ========================================================================== */
    function setStage(stage) {
      currentStage = stage;
      if (stage === 1) {
        stageBadgeEl.textContent = "1단계: 입으로 말하기 🎤";
        stageBadgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-xl bg-rose-100 text-rose-700 border border-rose-200";
        speakingChallengeZone.style.display = "flex";
        blockAssemblyContainer.style.display = "none";
        secondaryMicBtn.style.display = "none";
        checkBlockBtn.style.display = "none";
        giveUpBtn.style.display = "none";
      } else if (stage === 2) {
        stageBadgeEl.textContent = "2단계: 블록 조립 힌트 🧩";
        stageBadgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-xl bg-amber-100 text-amber-800 border border-amber-300";
        speakingChallengeZone.style.display = "none";
        blockAssemblyContainer.style.display = "flex";
        secondaryMicBtn.style.display = "inline-flex";
        checkBlockBtn.style.display = "inline-flex";
        giveUpBtn.style.display = "inline-flex";
        mascotReactionEl.textContent = "🐱";
        speechBubbleEl.textContent = "블록을 순서대로 골라 문장을 완성해봐! (모르면 정답 보기를 눌러봐)";
      } else if (stage === 3) {
        stageBadgeEl.textContent = "3단계: 정답 확인 및 읽기 💡";
        stageBadgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-xl bg-purple-100 text-purple-800 border border-purple-300";
        speakingChallengeZone.style.display = "none";
        blockAssemblyContainer.style.display = "flex";
        checkBlockBtn.style.display = "none";
        giveUpBtn.style.display = "none";
        secondaryMicBtn.style.display = "none";
      }
    }

    // 2단계 진입: 단어 블록 보기 클릭
    showBlocksBtn.addEventListener('click', () => {
      sounds.hint();
      setStage(2);
    });

    // 3단계 진입: 도저히 모를 때 정답 보기 클릭
    giveUpBtn.addEventListener('click', () => {
      sounds.click();
      setStage(3);
      revealCorrectAnswer();
    });

    function revealCorrectAnswer() {
      const q = questions[currentIndex];
      assembledZoneEl.innerHTML = '';
      wordBankZoneEl.innerHTML = '';

      q.target.forEach((word, idx) => {
        const block = createWordBlock(word, idx);
        assembledZoneEl.appendChild(block);
      });

      mascotReactionEl.textContent = "💡";
      speechBubbleEl.textContent = "정답 문장이야! 소리를 듣고 큰 소리로 따라 해봐!";

      // 🔥 정답 문장 즉시 음성 재생
      const fullSpeech = q.rawEnglish || formatForSpeech(q.target);
      speakSentence(fullSpeech);

      nextBtn.style.display = "inline-flex";
    }

    /* ==========================================================================
       7. 블록 조립 UI & 렌더링
       ========================================================================== */
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return hash;
    }

    function loadQuestion(index) {
      if (questions.length === 0) {
        koreanSentenceEl.textContent = "표시할 문장이 없습니다. 구글 시트를 확인해주세요!";
        return;
      }

      if (index >= questions.length) {
        triggerGameCompletion();
        return;
      }

      currentIndex = index;
      nextBtn.style.display = "none";

      const q = questions[currentIndex];
      koreanSentenceEl.textContent = q.korean;
      questionBadgeEl.textContent = `문제 ${currentIndex + 1} / ${questions.length}`;

      assembledZoneEl.innerHTML = '';
      assembledZoneEl.appendChild(emptySlotPlaceholderEl);
      emptySlotPlaceholderEl.style.display = 'flex';
      wordBankZoneEl.innerHTML = '';

      const allWords = [...q.target];
      if (q.distractors && q.distractors.length > 0) {
        allWords.push(...q.distractors);
      }
      const shuffledWords = shuffle(allWords);

      shuffledWords.forEach((word, idx) => {
        const block = createWordBlock(word, idx);
        wordBankZoneEl.appendChild(block);
      });

      // 1단계 스피킹 단독 모드로 시작
      setStage(1);
      mascotReactionEl.textContent = "🐱";
      speechBubbleEl.textContent = "마이크 버튼을 누르고 영어로 말해봐!";
    }

    function createWordBlock(wordText, id) {
      const palette = BLOCK_PALETTES[Math.abs(hashString(wordText)) % BLOCK_PALETTES.length];
      const block = document.createElement('div');
      
      const isPunctuation = [".", ",", "!", "?"].includes(wordText);
      const paddingClass = isPunctuation ? "px-3.5 py-1.5 text-2xl" : "px-4 py-2 sm:px-5 sm:py-2.5 text-lg sm:text-xl";

      block.className = `word-block font-english font-bold ${paddingClass} rounded-2xl border-2 ${palette.bg} ${palette.text} ${palette.border} ${palette.hover} cursor-pointer select-none flex items-center justify-center gap-1`;
      block.setAttribute('draggable', 'true');
      block.setAttribute('data-word', wordText);
      block.setAttribute('data-id', `block-${id}-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`);

      block.innerHTML = `<span>${wordText}</span>`;

      block.addEventListener('click', () => {
        if (currentStage === 3) return;
        sounds.click();
        if (block.parentElement === wordBankZoneEl) {
          moveBlockToAssembled(block);
        } else {
          moveBlockToBank(block);
        }
      });

      block.addEventListener('dragstart', (e) => {
        if (currentStage === 3) return;
        sounds.click();
        block.classList.add('opacity-40', 'scale-95');
        e.dataTransfer.setData('text/plain', block.getAttribute('data-id'));
      });

      block.addEventListener('dragend', () => {
        block.classList.remove('opacity-40', 'scale-95');
      });

      return block;
    }

    function moveBlockToAssembled(block) {
      emptySlotPlaceholderEl.style.display = 'none';
      assembledZoneEl.appendChild(block);
      sounds.drop();
    }

    function moveBlockToBank(block) {
      wordBankZoneEl.appendChild(block);
      sounds.drop();
      if (assembledZoneEl.querySelectorAll('.word-block').length === 0) {
        emptySlotPlaceholderEl.style.display = 'flex';
      }
    }

    [assembledZoneEl, wordBankZoneEl].forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('drag-over');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const blockId = e.dataTransfer.getData('text/plain');
        const block = document.querySelector(`[data-id="${blockId}"]`);
        if (block) {
          if (zone === assembledZoneEl) {
            moveBlockToAssembled(block);
          } else {
            moveBlockToBank(block);
          }
        }
      });
    });

    function getAssembledSentence() {
      const blocks = assembledZoneEl.querySelectorAll('.word-block');
      const words = [];
      blocks.forEach(b => words.push(b.getAttribute('data-word')));
      return words;
    }

    function formatForSpeech(wordList) {
      return wordList.reduce((acc, word) => {
        if ([".", ",", "!", "?"].includes(word)) return acc + word;
        return acc === "" ? word : acc + " " + word;
      }, "");
    }

    /* ==========================================================================
       8. 정답 판정 & 보상 루틴
       ========================================================================== */
    function handleSuccess(earnedCoins, msg) {
      sounds.correct();
      triggerConfetti();

      mascotReactionEl.textContent = "🥳";
      speechBubbleEl.textContent = msg;

      coins += earnedCoins;
      currentStreak += 1;
      coinScoreEl.textContent = coins.toLocaleString();
      streakCountEl.textContent = currentStreak;
      localStorage.setItem('block_english_coins', coins);

      // 🔥 정답 맞췄을 때 즉시 원어민 발음 재생
      const q = questions[currentIndex];
      const fullSpeech = q.rawEnglish || formatForSpeech(q.target);
      speakSentence(fullSpeech);

      checkBlockBtn.style.display = "none";
      giveUpBtn.style.display = "none";
      speakingChallengeZone.style.display = "none";
      secondaryMicBtn.style.display = "none";
      nextBtn.style.display = "inline-flex";
    }

    // 2단계: 블록 정답 확인 클릭
    checkBlockBtn.addEventListener('click', () => {
      const q = questions[currentIndex];
      const userWords = getAssembledSentence();

      if (userWords.length === 0) {
        mascotReactionEl.textContent = "🤔";
        speechBubbleEl.textContent = "블록을 조립해서 문장을 만들어줘!";
        playTone(300, 'sine', 0.1);
        return;
      }

      const isCorrect = userWords.length === q.target.length && 
        userWords.every((word, i) => word.toLowerCase() === q.target[i].toLowerCase());

      if (isCorrect) {
        handleSuccess(10, "블록 힌트 정답이야! 참 잘했어! 🌟");
      } else {
        sounds.wrong();
        assembledZoneEl.classList.add('animate-shake');
        setTimeout(() => assembledZoneEl.classList.remove('animate-shake'), 400);

        currentStreak = 0;
        streakCountEl.textContent = currentStreak;

        mascotReactionEl.textContent = "🐣";
        speechBubbleEl.textContent = "단어 순서가 조금 아쉬워요! 다시 해볼까? (모르면 '정답 보기'를 눌러봐)";
      }
    });

    nextBtn.addEventListener('click', () => {
      sounds.click();
      loadQuestion(currentIndex + 1);
    });

    clearSlotsBtn.addEventListener('click', () => {
      if (currentStage === 3) return;
      sounds.click();
      const assembledBlocks = Array.from(assembledZoneEl.querySelectorAll('.word-block'));
      assembledBlocks.forEach(block => wordBankZoneEl.appendChild(block));
      emptySlotPlaceholderEl.style.display = 'flex';
    });

    function triggerConfetti() {
      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.7 },
        colors: ['#38bdf8', '#facc15', '#f43f5e', '#4ade80', '#c084fc']
      });
    }

    function triggerGameCompletion() {
      sounds.win();
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });

      koreanSentenceEl.textContent = "🎉 축하합니다! 모든 미션을 완료했어요!";
      speakingChallengeZone.style.display = "none";
      blockAssemblyContainer.style.display = "flex";
      assembledZoneEl.innerHTML = `
        <div class="w-full py-8 text-center">
          <p class="text-2xl font-black text-indigo-800 mb-2">당신은 최고의 스피킹 탐험가! 🏆</p>
          <p class="text-slate-500 mb-4 font-sans">누적 획득 코인: ${coins.toLocaleString()}개 🪙</p>
          <button onclick="loadQuestion(0)" class="toy-btn bg-emerald-500 text-white font-bold text-lg px-8 py-3 rounded-2xl">
            처음부터 다시 도전하기 🚀
          </button>
        </div>
      `;
      wordBankZoneEl.innerHTML = '';
      checkBlockBtn.style.display = "none";
      giveUpBtn.style.display = "none";
      secondaryMicBtn.style.display = "none";
      nextBtn.style.display = "none";
      mascotReactionEl.textContent = "👑";
      speechBubbleEl.textContent = "완벽해! 오늘 스피킹 공부도 대성공이야!";
    }

    /* ==========================================================================
       9. 데이터 초기화
       ========================================================================== */
    async function loadDataAndInitialize() {
      refreshIcon.classList.add('animate-spin');
      dataSourceBadgeEl.textContent = "시트 연결 중...";
      dataSourceBadgeEl.className = "text-[11px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded-lg border border-indigo-200";

      const sheetData = await fetchQuestionsFromSheet(GOOGLE_SHEET_CSV_URL);
      refreshIcon.classList.remove('animate-spin');

      if (sheetData && sheetData.length > 0) {
        questions = sheetData;
        dataSourceBadgeEl.textContent = "구글 시트 연동됨";
        dataSourceBadgeEl.className = "text-[11px] text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200";
        speechBubbleEl.textContent = `구글 시트에서 ${questions.length}개의 문장을 가져왔어요! ✨`;
        loadQuestion(0);
      } else {
        questions = [...FALLBACK_QUESTIONS];
        dataSourceBadgeEl.textContent = "기본 샘플 모드";
        dataSourceBadgeEl.className = "text-[11px] text-slate-600 font-bold bg-slate-100 px-2 py-0.5 rounded-lg border border-slate-200";
        speechBubbleEl.textContent = "구글 시트 연결을 확인해주세요. 기본 문장으로 시작합니다.";
        loadQuestion(0);
      }
    }

    refreshSheetBtn.addEventListener('click', () => {
      sounds.click();
      loadDataAndInitialize();
    });

    window.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
      loadDataAndInitialize();
    });
  </script>
</body>
</html>
