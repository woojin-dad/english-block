<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>말문 팡팡 🧩🎤</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Jua', 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: linear-gradient(180deg, #03c75a 0%, #02b350 40%, #029f48 100%) !important;
      min-height: 100vh;
    }

    .font-eng {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    .toy-btn {
      transition: all 0.1s ease-in-out;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    }
    .toy-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
    }

    .word-block {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }
    .word-block:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .word-block:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
    }

    .slot-zone {
      min-height: 90px;
      border: 3px dashed #a7f3d0;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.95);
    }
    .slot-zone.drag-over {
      border-color: #03c75a;
      background-color: #d1fae5;
      transform: scale(1.01);
    }

    .gauge-bg {
      width: 110px;
      height: 18px;
      background: #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #d1d5db;
    }
    #gaugeFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4ade80, #16a34a);
      transition: width 0.4s ease-out;
    }

    @keyframes shakeMotion {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shakeMotion 0.35s ease;
    }

    @keyframes micGlowPulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-active {
      animation: micGlowPulse 1.2s infinite;
      background-color: #ef4444 !important;
      border-color: #b91c1c !important;
    }
  </style>
</head>
<body class="flex flex-col text-slate-800 p-2 sm:p-4 md:p-6">

  <!-- 헤더 영역 -->
  <header class="max-w-4xl w-full mx-auto flex flex-wrap items-center justify-between bg-white/95 backdrop-blur-md px-4 py-3 sm:px-6 rounded-3xl shadow-lg border border-emerald-300 gap-3 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-amber-300 rounded-2xl flex items-center justify-center text-3xl shadow-inner border-2 border-amber-400">
        🧩
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-wide">
          말문 팡팡
        </h1>
        <p class="text-xs text-slate-500 font-sans">입으로 먼저 말해보고, 모르면 블록 힌트!</p>
      </div>
    </div>

    <!-- ⚡ 매칭게임 연동 게이지 & 선물 상자 -->
    <div class="flex items-center gap-2 sm:gap-3 ml-auto bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-2xl shadow-inner">
      <span class="text-lg">⚡</span>
      <div class="gauge-bg">
        <div id="gaugeFill"></div>
      </div>
      <div class="font-black text-slate-800 text-base sm:text-lg flex items-center gap-1 ml-1" title="선물 상자">
        <span>🎁</span>
        <span id="giftCount" class="text-emerald-700">0</span>
      </div>
    </div>
  </header>

  <!-- 메인 게임 영역 -->
  <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col gap-3.5">
    
    <!-- 1번 박스: 문장 및 백분율 배지 -->
    <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-lg border border-emerald-100 text-center flex flex-col items-center justify-center min-h-[130px] relative">
      <div id="accuracyBadge" class="absolute top-3.5 right-4 sm:top-4 sm:right-6 text-xs sm:text-sm font-black px-3 py-1 rounded-full border shadow-sm transition-all">
        🎯 --%
      </div>

      <div id="koreanSentence" class="text-2xl sm:text-3xl md:text-4xl font-black text-slate-900 tracking-tight leading-snug px-4">
        문장을 불러오는 중입니다... 🧩
      </div>
    </div>

    <!-- 2번 박스 (1단계): 스피킹 영역 -->
    <div id="stage1Box" class="bg-white rounded-3xl p-6 sm:p-10 shadow-lg border border-emerald-100 flex flex-col items-center justify-center text-center gap-3">
      <p id="stage1TipText" class="text-base sm:text-lg font-black text-slate-800">
        머릿속으로 영어가 떠올랐나요?
      </p>

      <button id="mainMicBtn" class="toy-btn bg-rose-500 hover:bg-rose-600 text-white font-black text-lg sm:text-xl px-10 sm:px-14 py-4 rounded-3xl flex items-center gap-3 shadow-md scale-105 transition-all">
        <span id="mainMicIcon" class="text-3xl">🎤</span>
        <span id="mainMicLabel">마이크 누르고 말하기</span>
      </button>

      <!-- 내가 방금 말한 내용을 살짝 보여주는 디버깅 힌트 -->
      <div id="spokenDebugText" class="text-xs font-sans text-slate-400 min-h-[18px]"></div>

      <!-- 2단계 진입 버튼 -->
      <button id="openBlockBtn" class="text-sm text-[#029f48] hover:text-[#02833b] bg-emerald-50 hover:bg-emerald-100 px-5 py-2.5 rounded-2xl border border-emerald-300 font-black transition flex items-center gap-1.5 shadow-sm">
        <span>🧩 잘 모르겠어요 (단어 블록 보기)</span>
      </button>
    </div>

    <!-- 3번 박스 (2단계): 블록 조립 컨테이너 -->
    <div id="stage2Box" style="display: none;" class="flex flex-col gap-3.5">
      <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-lg border border-emerald-100">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-sm sm:text-base font-bold text-slate-700 flex items-center gap-1">
              <span>🎯</span> 내가 만든 문장
            </span>
            <span class="text-xs text-slate-400 font-sans hidden sm:inline">(블록을 누르면 보관함으로 돌아갑니다)</span>
          </div>
          <button id="clearBtn" class="text-xs text-rose-500 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-xl transition flex items-center gap-1">
            <span>🔄</span> 비우기
          </button>
        </div>

        <div id="assembledSlots" class="slot-zone p-3 sm:p-4 flex flex-wrap items-center gap-2 sm:gap-3 transition-colors duration-200">
          <div id="emptyGuideText" class="w-full text-center text-slate-400 text-xs sm:text-sm py-4 flex flex-col items-center justify-center pointer-events-none">
            <span class="text-2xl mb-1">👇</span>
            <span>아래 단어 블록을 클릭해서 문장을 완성해보세요!</span>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-lg border border-emerald-100">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-sm sm:text-base font-bold text-slate-700 flex items-center gap-1">
            <span>📦</span> 단어 블록 보관함
          </span>
          <span class="text-xs text-[#03c75a] font-bold">블록 힌트가 열렸어요!</span>
        </div>
        <div id="wordPool" class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 min-h-[90px] p-3 bg-slate-50 rounded-2xl border border-slate-200">
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤 버튼 바 -->
    <div class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-4 mt-1 pb-4">
      <button id="checkBlockBtn" style="display: none;" class="toy-btn bg-[#03c75a] hover:bg-[#029f48] text-white font-bold text-base sm:text-lg px-6 sm:px-10 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>✨ 블록 정답 확인</span>
      </button>

      <button id="giveUpBtn" style="display: none;" class="toy-btn bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-sm sm:text-base px-4 sm:px-6 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>💡 정답 보기</span>
      </button>

      <button id="listenAgainBtn" style="display: none;" class="toy-btn bg-sky-500 hover:bg-sky-600 text-white font-bold text-base sm:text-lg px-5 sm:px-7 py-3 rounded-2xl flex items-center gap-1.5 shadow-md">
        <span>🔊 다시 듣기</span>
      </button>

      <button id="nextBtn" style="display: none;" class="toy-btn bg-[#03c75a] hover:bg-[#029f48] text-white font-bold text-base sm:text-lg px-8 sm:px-12 py-3 rounded-2xl flex items-center gap-2 animate-pulse shadow-md">
        <span>다음 문제 ➡️</span>
      </button>
    </div>
  </main>

  <script>
    /* ==========================================================================
       1. 효과음 및 오디오 언락 시스템
       ========================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isAudioUnlocked = false;

    function unlockAudioSystem() {
      if (isAudioUnlocked) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        const dummy = new SpeechSynthesisUtterance('');
        dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
      }
      isAudioUnlocked = true;
    }
    window.addEventListener('click', unlockAudioSystem, { once: true });
    window.addEventListener('touchstart', unlockAudioSystem, { once: true });

    function playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }, delay * 1000);
    }

    const sound = {
      pop() { playTone(580, 'triangle', 0.07); },
      drop() { playTone(440, 'sine', 0.08); },
      hint() { playTone(520, 'sine', 0.12); playTone(680, 'sine', 0.18, 0.08); },
      mic() { playTone(750, 'sine', 0.12); },
      success() {
        playTone(523.25, 'sine', 0.12, 0.0);
        playTone(659.25, 'sine', 0.12, 0.08);
        playTone(783.99, 'sine', 0.12, 0.16);
        playTone(1046.50, 'triangle', 0.35, 0.24);
      },
      wrong() {
        playTone(320, 'sawtooth', 0.15, 0.0);
        playTone(220, 'sawtooth', 0.25, 0.12);
      },
      gift() {
        [523, 659, 784, 1046, 1318].forEach((f, i) => playTone(f, 'triangle', 0.22, i * 0.1));
      }
    };

    /* ==========================================================================
       🔊 2. TTS 엔진
       ========================================================================== */
    let availableVoices = [];

    function updateVoiceList() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }

    if ('speechSynthesis' in window) {
      updateVoiceList();
      window.speechSynthesis.onvoiceschanged = updateVoiceList;
    }

    function getBestEnglishVoice() {
      if (availableVoices.length === 0) updateVoiceList();
      
      const premiumVoice = availableVoices.find(v => 
        v.lang.startsWith('en') && 
        (v.name.includes('Natural') || v.name.includes('Google US') || v.name.includes('Enhanced') || v.name.includes('Samantha') || v.name.includes('Ava') || v.name.includes('Nicky') || v.name.includes('Allison'))
      );
      if (premiumVoice) return premiumVoice;

      const usVoice = availableVoices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
      if (usVoice) return usVoice;

      return availableVoices.find(v => v.lang.startsWith('en'));
    }

    function speakText(text) {
      if (!text || !('speechSynthesis' in window)) return;
      unlockAudioSystem();

      const cleanText = text.trim();

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      setTimeout(() => {
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = 'en-US';
        utter.rate = 0.88;
        utter.pitch = 1.0;
        utter.volume = 1.0;

        const targetVoice = getBestEnglishVoice();
        if (targetVoice) utter.voice = targetVoice;

        window.speechSynthesis.speak(utter);
      }, 10);
    }

    /* ==========================================================================
       3. 구글 시트 & 클라우드 연동
       ========================================================================== */
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8N05mr2cDulqUEd6ws-n6SOOE-L3yaBSUDg43QPP1Xmz65CCeu_5Kl84OFzUi8MoNlRRpoATStnfW/pub?output=csv";
    const CLOUD_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlPT7SuPsd70jPhYkj7hsB23PF7wCk9FqQBI2psOo1yDdBDKdmpmraflnGMOt1cpX-kA/exec";

    const BACKUP_QUESTIONS = [
      { kr: "당신은 키가 커요.", en: "You are tall." },
      { kr: "나는 매일 아침 사과를 먹어요.", en: "I eat an apple every morning." }
    ];

    const BLOCK_THEMES = [
      { bg: "bg-emerald-100", text: "text-emerald-950", border: "border-emerald-300" },
      { bg: "bg-amber-100", text: "text-amber-950", border: "border-amber-300" },
      { bg: "bg-sky-100", text: "text-sky-950", border: "border-sky-300" },
      { bg: "bg-purple-100", text: "text-purple-950", border: "border-purple-300" },
      { bg: "bg-teal-100", text: "text-teal-950", border: "border-teal-300" },
      { bg: "bg-orange-100", text: "text-orange-950", border: "border-orange-300" }
    ];

    let questions = [];
    let curIndex = 0;
    
    let cloudState = {
      coins: 0,
      totalMatchedCount: 0,
      giftCount: 0,
      maxGauge: 500
    };

    let sentenceStatsDB = JSON.parse(localStorage.getItem('block_sentence_stats')) || {};
    let isCurrentTrialRecorded = false;

    let stage = 1;
    let isRecording = false;
    let recognition = null;

    const gaugeFill = document.getElementById('gaugeFill');
    const giftCount = document.getElementById('giftCount');
    const koreanSentence = document.getElementById('koreanSentence');
    const accuracyBadge = document.getElementById('accuracyBadge');

    const stage1Box = document.getElementById('stage1Box');
    const stage2Box = document.getElementById('stage2Box');
    const assembledSlots = document.getElementById('assembledSlots');
    const emptyGuideText = document.getElementById('emptyGuideText');
    const wordPool = document.getElementById('wordPool');

    const mainMicBtn = document.getElementById('mainMicBtn');
    const mainMicIcon = document.getElementById('mainMicIcon');
    const mainMicLabel = document.getElementById('mainMicLabel');
    const spokenDebugText = document.getElementById('spokenDebugText');
    const stage1TipText = document.getElementById('stage1TipText');
    const openBlockBtn = document.getElementById('openBlockBtn');
    const checkBlockBtn = document.getElementById('checkBlockBtn');
    const giveUpBtn = document.getElementById('giveUpBtn');
    const listenAgainBtn = document.getElementById('listenAgainBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');

    async function syncFromCloud() {
      try {
        const res = await fetch(CLOUD_SCRIPT_URL);
        const data = await res.json();
        if (data.coins !== undefined) {
          cloudState.coins = Number(data.coins) || 0;
          cloudState.giftCount = Number(data.gifts) || 0;
          cloudState.totalMatchedCount = Number(data.matched) || 0;
          cloudState.maxGauge = Number(data.maxGauge) || 500;
          updateGaugeUI(false);
        }
      } catch (e) {}
    }

    async function syncToCloud() {
      try {
        if (cloudState.totalMatchedCount >= cloudState.maxGauge) {
          cloudState.giftCount += 1;
          cloudState.coins += 500;
          cloudState.totalMatchedCount = 0;
          sound.gift();
          confetti({ particleCount: 250, spread: 85, origin: { y: 0.6 } });
        }
        await fetch(CLOUD_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            coins: cloudState.coins,
            matched: cloudState.totalMatchedCount,
            gifts: cloudState.giftCount
          })
        });
      } catch (e) {}
    }

    function updateGaugeUI(sendToCloud = true) {
      const progress = (cloudState.totalMatchedCount / cloudState.maxGauge) * 100;
      gaugeFill.style.width = Math.min(progress, 100) + '%';
      giftCount.textContent = cloudState.giftCount;
      if (sendToCloud) syncToCloud();
    }

    function addGauge(points) {
      cloudState.totalMatchedCount += points;
      updateGaugeUI(true);
    }

    function updateAccuracyBadgeUI(enSentence) {
      const stat = sentenceStatsDB[enSentence];
      if (!stat || stat.trials === 0) {
        accuracyBadge.textContent = "🎯 NEW";
        accuracyBadge.className = "absolute top-3.5 right-4 sm:top-4 sm:right-6 text-xs sm:text-sm font-black px-3 py-1 rounded-full border shadow-sm bg-slate-100 text-slate-600 border-slate-300";
        return;
      }

      const rate = Math.round((stat.hits / stat.trials) * 100);
      accuracyBadge.textContent = `🎯 ${rate}%`;

      if (rate >= 80) {
        accuracyBadge.className = "absolute top-3.5 right-4 sm:top-4 sm:right-6 text-xs sm:text-sm font-black px-3 py-1 rounded-full border shadow-sm bg-emerald-100 text-[#02833b] border-[#a7f3d0]";
      } else if (rate >= 50) {
        accuracyBadge.className = "absolute top-3.5 right-4 sm:top-4 sm:right-6 text-xs sm:text-sm font-black px-3 py-1 rounded-full border shadow-sm bg-amber-100 text-amber-800 border-amber-300";
      } else {
        accuracyBadge.className = "absolute top-3.5 right-4 sm:top-4 sm:right-6 text-xs sm:text-sm font-black px-3 py-1 rounded-full border shadow-sm bg-rose-100 text-rose-700 border-rose-300";
      }
    }

    function recordSentenceResult(isSuccess) {
      if (isCurrentTrialRecorded) return;
      isCurrentTrialRecorded = true;

      const q = questions[curIndex];
      if (!q) return;

      if (!sentenceStatsDB[q.en]) sentenceStatsDB[q.en] = { trials: 0, hits: 0 };

      sentenceStatsDB[q.en].trials += 1;
      if (isSuccess) sentenceStatsDB[q.en].hits += 1;

      localStorage.setItem('block_sentence_stats', JSON.stringify(sentenceStatsDB));
      updateAccuracyBadgeUI(q.en);
    }

    /* 💡 [출제 우선순위 알고리즘 변경]
       1순위: NEW 문장 (한 번도 안 푼 문장)
       2순위: 틀린 적이 있는 문장 (정답률 0% ~ 99%)
       3순위: 정답률 100% 문장
    */
    function sortQuestionsByAccuracy(list) {
      return list.sort((a, b) => {
        const statA = sentenceStatsDB[a.en];
        const statB = sentenceStatsDB[b.en];

        const rateA = statA && statA.trials > 0 ? (statA.hits / statA.trials) * 100 : -1;
        const rateB = statB && statB.trials > 0 ? (statB.hits / statB.trials) * 100 : -1;

        const getPriorityTier = (rate) => {
          if (rate === -1) return 1;                   // 1순위: NEW
          if (rate >= 0 && rate < 100) return 2;        // 2순위: 틀린 적이 있는 문장
          return 3;                                    // 3순위: 정답률 100%
        };

        const tierA = getPriorityTier(rateA);
        const tierB = getPriorityTier(rateB);

        if (tierA !== tierB) return tierA - tierB;

        // 2순위 내부: 정답률이 더 낮은 문장이 먼저 출제
        if (tierA === 2) {
          if (rateA !== rateB) return rateA - rateB;
          return (statB.trials || 0) - (statA.trials || 0);
        }
        return 0;
      });
    }

    function normalizeForSpeech(str) {
      if (!str) return "";
      let s = str.toLowerCase();

      s = s.replace(/['"’‘.,!?;:\-]/g, ' ');

      s = s.replace(/\byour\b/g, 'you are')
           .replace(/\byoure\b/g, 'you are')
           .replace(/\byou are\b/g, 'you are')
           .replace(/\bim\b/g, 'i am')
           .replace(/\bi am\b/g, 'i am')
           .replace(/\bits\b/g, 'it is')
           .replace(/\bit is\b/g, 'it is')
           .replace(/\bhes\b/g, 'he is')
           .replace(/\bshes\b/g, 'she is')
           .replace(/\btheyre\b/g, 'they are')
           .replace(/\btheir\b/g, 'they are')
           .replace(/\bwere\b/g, 'we are');

      s = s.replace(/\btoll\b/g, 'tall');

      return s.replace(/\s+/g, ' ').trim();
    }

    /* ==========================================================================
       4. Web Speech STT
       ========================================================================== */
    function initSTT() {
      const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechClass) {
        mainMicBtn.classList.add('opacity-50');
        mainMicBtn.title = "사파리(Safari) 또는 크롬(Chrome) 브라우저를 사용해 주세요.";
        return;
      }

      recognition = new SpeechClass();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 3;

      recognition.onstart = () => {
        isRecording = true;
        sound.mic();
        mainMicBtn.classList.add('mic-active');
        mainMicIcon.textContent = "🛑";
        mainMicLabel.textContent = "듣고 있어요... 말씀하세요!";
        spokenDebugText.textContent = "";
      };

      recognition.onresult = (e) => {
        const spokenList = [];
        for (let i = 0; i < e.results[0].length; i++) {
          spokenList.push(e.results[0][i].transcript);
        }
        handleSpokenResults(spokenList);
      };

      recognition.onerror = () => { stopSTT(); };
      recognition.onend = () => { stopSTT(); };
    }

    function toggleSTT() {
      unlockAudioSystem();
      if (!recognition) {
        alert("사파리(Safari) 또는 크롬(Chrome) 브라우저를 사용해 주세요!");
        return;
      }
      if (isRecording) {
        recognition.stop();
        stopSTT();
      } else {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      }
    }

    function stopSTT() {
      isRecording = false;
      mainMicBtn.classList.remove('mic-active');
      mainMicIcon.textContent = "🎤";
      mainMicLabel.textContent = "마이크 누르고 말하기";
    }

    mainMicBtn.addEventListener('click', toggleSTT);

    function handleSpokenResults(spokenList) {
      const q = questions[curIndex];
      const targetNorm = normalizeForSpeech(q.en);

      const primarySpoken = spokenList[0] || '';
      spokenDebugText.textContent = `들린 말: "${primarySpoken}"`;

      const isMatched = spokenList.some(spoken => {
        const spokenNorm = normalizeForSpeech(spoken);
        return spokenNorm === targetNorm;
      });

      if (isMatched) {
        spokenDebugText.textContent = `🎯 완벽해요: "${primarySpoken}"`;
        recordSentenceResult(true);
        onAnswerCorrect(3);
      } else {
        sound.wrong();
      }
    }

    /* ==========================================================================
       5. 단계 컨트롤
       ========================================================================== */
    function setGameStage(newStage) {
      stage = newStage;
      if (stage === 1) {
        stage1Box.style.display = "flex";
        stage2Box.style.display = "none";
        checkBlockBtn.style.display = "none";
        giveUpBtn.style.display = "none";
        listenAgainBtn.style.display = "none";
      } else if (stage === 2) {
        stage1Box.style.display = "none";
        stage2Box.style.display = "flex";
        checkBlockBtn.style.display = "inline-flex";
        giveUpBtn.style.display = "inline-flex";
        listenAgainBtn.style.display = "none";
      } else if (stage === 3) {
        stage1Box.style.display = "none";
        stage2Box.style.display = "flex";
        checkBlockBtn.style.display = "none";
        giveUpBtn.style.display = "none";
        listenAgainBtn.style.display = "inline-flex";
      }
    }

    openBlockBtn.addEventListener('click', () => {
      unlockAudioSystem();
      sound.hint();
      recordSentenceResult(false);
      setGameStage(2);
    });

    giveUpBtn.addEventListener('click', () => {
      unlockAudioSystem();
      recordSentenceResult(false);
      setGameStage(3);
      revealAnswerDirectly();
    });

    listenAgainBtn.addEventListener('click', () => {
      unlockAudioSystem();
      const q = questions[curIndex];
      speakText(q.en);
    });

    function revealAnswerDirectly() {
      const q = questions[curIndex];
      assembledSlots.innerHTML = '';
      wordPool.innerHTML = '';

      q.tokens.forEach((word, idx) => {
        const blk = makeBlockElement(word, idx);
        assembledSlots.appendChild(blk);
      });

      speakText(q.en);
      nextBtn.style.display = "inline-flex";
    }

    function tokenizeEnglish(sentence) {
      if (!sentence) return [];
      let clean = sentence.trim().replace(/[.!?\s]+$/, '');
      const words = clean.split(/\s+/).map(w => {
        return w.replace(/[.!?]+$/, '');
      }).filter(w => w.length > 0);
      return words;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function hashWord(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
      return Math.abs(hash);
    }

    function loadQuestion(idx) {
      if (questions.length === 0) {
        koreanSentence.textContent = "문장을 불러올 수 없습니다. 구글 시트를 확인해주세요.";
        return;
      }
      if (idx >= questions.length) {
        finishGameCelebration();
        return;
      }

      curIndex = idx;
      isCurrentTrialRecorded = false;
      nextBtn.style.display = "none";
      listenAgainBtn.style.display = "none";
      spokenDebugText.textContent = "";

      const q = questions[curIndex];
      koreanSentence.textContent = q.kr;

      updateAccuracyBadgeUI(q.en);

      assembledSlots.innerHTML = '';
      assembledSlots.appendChild(emptyGuideText);
      emptyGuideText.style.display = 'flex';
      wordPool.innerHTML = '';

      const shuffled = shuffleArray(q.tokens);

      shuffled.forEach((word, i) => {
        const blk = makeBlockElement(word, i);
        wordPool.appendChild(blk);
      });

      setGameStage(1);
    }

    function makeBlockElement(word, id) {
      const theme = BLOCK_THEMES[hashWord(word) % BLOCK_THEMES.length];
      const el = document.createElement('div');
      const pad = "px-4 py-2 sm:px-5 sm:py-2.5 text-lg sm:text-xl";

      el.className = `word-block font-eng font-bold ${pad} rounded-2xl border-2 ${theme.bg} ${theme.text} ${theme.border} select-none flex items-center justify-center gap-1`;
      el.setAttribute('draggable', 'true');
      el.setAttribute('data-word', word);
      el.setAttribute('data-uid', `blk-${id}-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`);
      el.innerHTML = `<span>${word}</span>`;

      el.addEventListener('click', () => {
        if (stage === 3) {
          speakText(questions[curIndex].en);
          return;
        }

        sound.pop();
        if (el.parentElement === wordPool) {
          emptyGuideText.style.display = 'none';
          assembledSlots.appendChild(el);
          sound.drop();
        } else {
          wordPool.appendChild(el);
          sound.drop();
          if (assembledSlots.querySelectorAll('.word-block').length === 0) {
            emptyGuideText.style.display = 'flex';
          }
        }
      });

      el.addEventListener('dragstart', (e) => {
        if (stage === 3) return;
        unlockAudioSystem();
        sound.pop();
        el.classList.add('opacity-40');
        e.dataTransfer.setData('text/plain', el.getAttribute('data-uid'));
      });

      el.addEventListener('dragend', () => el.classList.remove('opacity-40'));

      return el;
    }

    [assembledSlots, wordPool].forEach(zone => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        unlockAudioSystem();
        zone.classList.remove('drag-over');
        const uid = e.dataTransfer.getData('text/plain');
        const blk = document.querySelector(`[data-uid="${uid}"]`);
        if (blk) {
          if (zone === assembledSlots) {
            emptyGuideText.style.display = 'none';
            assembledSlots.appendChild(blk);
          } else {
            wordPool.appendChild(blk);
            if (assembledSlots.querySelectorAll('.word-block').length === 0) emptyGuideText.style.display = 'flex';
          }
          sound.drop();
        }
      });
    });

    clearBtn.addEventListener('click', () => {
      if (stage === 3) return;
      unlockAudioSystem();
      sound.pop();
      const placed = Array.from(assembledSlots.querySelectorAll('.word-block'));
      placed.forEach(b => wordPool.appendChild(b));
      emptyGuideText.style.display = 'flex';
    });

    function onAnswerCorrect(gaugePoints) {
      unlockAudioSystem();
      sound.success();
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 }, colors: ['#03c75a', '#facc15', '#38bdf8', '#f43f5e'] });

      addGauge(gaugePoints);
      speakText(questions[curIndex].en);

      stage1Box.style.display = "none";
      checkBlockBtn.style.display = "none";
      giveUpBtn.style.display = "none";
      listenAgainBtn.style.display = "inline-flex";
      nextBtn.style.display = "inline-flex";
    }

    checkBlockBtn.addEventListener('click', () => {
      unlockAudioSystem();
      const q = questions[curIndex];
      const placed = Array.from(assembledSlots.querySelectorAll('.word-block')).map(b => b.getAttribute('data-word'));

      if (placed.length === 0) {
        playTone(300, 'sine', 0.1);
        return;
      }

      const isSame = placed.length === q.tokens.length && placed.every((w, i) => w.toLowerCase() === q.tokens[i].toLowerCase());

      if (isSame) {
        onAnswerCorrect(2);
      } else {
        sound.wrong();
        assembledSlots.classList.add('animate-shake');
        setTimeout(() => assembledSlots.classList.remove('animate-shake'), 400);
      }
    });

    nextBtn.addEventListener('click', () => {
      unlockAudioSystem();
      sound.pop();
      loadQuestion(curIndex + 1);
    });

    function finishGameCelebration() {
      sound.gift();
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });

      koreanSentence.textContent = "🎉 모든 미션을 완료했어요!";
      stage1Box.style.display = "none";
      stage2Box.style.display = "flex";
      assembledSlots.innerHTML = `
        <div class="w-full py-8 text-center">
          <p class="text-2xl font-black text-slate-800 mb-2">당신은 최고의 말문 팡팡 마스터! 🏆</p>
          <p class="text-slate-500 mb-4 font-sans">누적 선물: ${cloudState.giftCount}개 🎁</p>
          <button onclick="restartGameWithResort()" class="toy-btn bg-[#03c75a] text-white font-bold text-lg px-8 py-3 rounded-2xl">
            약점 문장부터 다시 도전하기 🚀
          </button>
        </div>
      `;
      wordPool.innerHTML = '';
      checkBlockBtn.style.display = "none";
      giveUpBtn.style.display = "none";
      listenAgainBtn.style.display = "none";
      nextBtn.style.display = "none";
    }

    function restartGameWithResort() {
      questions = sortQuestionsByAccuracy([...questions]);
      loadQuestion(0);
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (insideQuote && next === '"') { cell += '"'; i++; }
          else insideQuote = !insideQuote;
        } else if (c === ',' && !insideQuote) {
          row.push(cell.trim()); cell = '';
        } else if ((c === '\r' || c === '\n') && !insideQuote) {
          if (c === '\r' && next === '\n') i++;
          row.push(cell.trim());
          if (row.some(val => val.length > 0)) rows.push(row);
          row = []; cell = '';
        } else {
          cell += c;
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        if (row.some(val => val.length > 0)) rows.push(row);
      }
      return rows;
    }

    async function loadDataFromSheet() {
      await syncFromCloud();

      try {
        const separator = SHEET_CSV_URL.includes('?') ? '&' : '?';
        const res = await fetch(`${SHEET_CSV_URL}${separator}cb=${Date.now()}`);
        if (!res.ok) throw new Error("네트워크 오류");
        const csv = await res.text();
        const parsed = parseCSV(csv);

        const rows = parsed.slice(1);
        const list = [];

        rows.forEach(r => {
          const kr = r[0] || '';
          const en = r[1] || '';

          if (kr.trim() && en.trim()) {
            list.push({
              kr: kr.trim(),
              en: en.trim(),
              tokens: tokenizeEnglish(en)
            });
          }
        });

        if (list.length > 0) {
          questions = sortQuestionsByAccuracy(list);
          loadQuestion(0);
          return;
        }
      } catch (e) {
        console.warn("시트 가져오기 실패, 기본 문장 사용:", e);
      }

      questions = sortQuestionsByAccuracy(BACKUP_QUESTIONS.map(q => ({
        kr: q.kr,
        en: q.en,
        tokens: tokenizeEnglish(q.en)
      })));
      loadQuestion(0);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSTT();
      loadDataFromSheet();
    });
  </script>
</body>
